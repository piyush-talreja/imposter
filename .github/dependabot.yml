version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Expo pins SDK-compatible versions of these; they only move during an
    # Expo SDK upgrade via `pnpm expo install --fix`, never via Dependabot.
    ignore:
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'jest-expo'
      - dependency-name: 'eslint-config-expo'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: '@types/react'
      - dependency-name: 'typescript'
      # Everything else: majors are deliberate upgrades, not weekly churn.
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
