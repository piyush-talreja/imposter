name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: app
        # Fresh scaffolds have no package.json yet; skip instead of failing.
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.exists == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.app.outputs.exists == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.app.outputs.exists == 'true'
        run: pnpm run --if-present lint
      - if: steps.app.outputs.exists == 'true'
        run: pnpm run --if-present typecheck
      - if: steps.app.outputs.exists == 'true'
        run: pnpm run --if-present test --ci
